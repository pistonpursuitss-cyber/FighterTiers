services:
  - type: web
    name: fighter-tiers
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: fighter-tiers-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: PANEL_CHANNEL_ID
        sync: false
      - key: FIGHTERS_DATA_PATH
        value: /var/data/fighters.json
